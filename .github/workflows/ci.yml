name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  host-tests-and-coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PlatformIO + gcovr
        run: |
          python -m pip install --upgrade pip
          pip install platformio==6.1.15 gcovr==7.2
      - name: Native tests
        run: pio test -e native --verbose
      - name: Coverage gate (Core only, >=85% line / >=70% branch)
        run: |
          gcovr \
            --root . \
            --object-directory .pio/build/native \
            --filter 'lib/wildlife_core/' \
            --exclude 'test/' \
            --print-summary \
            --xml-pretty --output coverage.xml \
            --html-details coverage_html/index.html \
            --fail-under-line 85 \
            --fail-under-branch 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            coverage.xml
            coverage_html/

  embedded-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio==6.1.15
      - name: Compile target firmware
        run: pio run -e xiao_esp32s3_sense
      - name: Static analysis
        run: pio check -e xiao_esp32s3_sense --severity=medium --fail-on-defect=medium

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: clang-format check
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format-18
          find lib src test -type f \( -name '*.hpp' -o -name '*.cpp' -o -name '*.h' -o -name '*.c' \) \
            -print0 | xargs -0 clang-format-18 --dry-run -Werror

  lint-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check tools/
        run: ruff check tools/
