; Wildlife Spotter — XIAO ESP32S3 Sense + Grove Vision AI V2
; Three envs:
;   xiao_esp32s3_sense      — production target (dual-OTA + LittleFS)
;   xiao_esp32s3_sense_dev  — fast-flash dev (single-app partition, no OTA)
;   native                  — host unit tests + coverage (no Arduino deps)

[platformio]
default_envs   = native
core_dir       = .pio/core
src_dir        = src
lib_dir        = lib
test_dir       = test
data_dir       = data

; -----------------------------------------------------------------------------
; Shared
; -----------------------------------------------------------------------------
[env]
build_flags =
    -D WILDLIFE_FW_VERSION=\"0.1.0\"
    -std=gnu++17
build_unflags = -std=gnu++11

; -----------------------------------------------------------------------------
; Embedded base (target envs share this)
; -----------------------------------------------------------------------------
[esp32s3_base]
platform        = espressif32@6.7.0
framework       = arduino
board           = seeed_xiao_esp32s3
monitor_speed   = 115200
upload_speed    = 115200
board_build.filesystem    = littlefs
board_build.psram_type    = opi
board_build.arduino.memory_type = qio_opi
; deep+ LDF lets WiFiManager (and other libs) discover transitive framework
; headers like WiFi.h that are not directly included from src/main.cpp.
lib_ldf_mode    = deep+
; Production / dev firmware never includes the vendored camera_web_server
; tree (which depends on ArduinoEigen). The dedicated camera-web env
; below overrides this filter to compile only that subtree.
build_src_filter =
    +<*>
    -<camera_web_server/>
; Mirror the build filter for static analysis so pio check does not flag
; defects in the vendored camera_web_server tree (which is not compiled
; into these envs).
check_patterns =
    src/main.cpp
    lib/wildlife_core
    lib/wildlife_adapters
check_skip_packages = yes
build_flags =
    ${env.build_flags}
    -D WILDLIFE_BOARD=xiao_esp32s3_sense
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_CDC_ON_BOOT=1
; LittleFS is built into espressif32@6.x (ESP-IDF 4+) — no external lib needed.
lib_deps =
    Seeed-Studio/Seeed_Arduino_SSCMA @ ^1.0.0
    knolleary/PubSubClient @ ^2.8
    tzapu/WiFiManager @ ^2.0.17
    bblanchon/ArduinoJson @ ^7.1.0
lib_extra_dirs = lib/wildlife_core

; Production: dual-OTA + LittleFS, OTA + rollback supported.
[env:xiao_esp32s3_sense]
extends = esp32s3_base
board_build.partitions = partitions/dual_ota_littlefs.csv

; Dev: single-app for fast iteration; no OTA.
[env:xiao_esp32s3_sense_dev]
extends = esp32s3_base
board_build.partitions = partitions/single_app_dev.csv
build_flags =
    ${esp32s3_base.build_flags}
    -D WILDLIFE_DEV_BUILD=1

; Seeed camera_web_server adaptation for Grove Vision AI V2 streaming.
; Credentials are injected from CAMERA_WIFI_SSID and CAMERA_WIFI_PASSWORD.
; If they are absent or Wi-Fi join fails, firmware starts the WSPOT-Camera AP.
[env:xiao_esp32s3_camera_web]
extends = esp32s3_base
board_build.partitions = partitions/single_app_dev.csv
build_src_filter =
    -<*>
    +<camera_web_server/*.cpp>
build_flags =
    ${esp32s3_base.build_flags}
    -D WILDLIFE_CAMERA_WEB_SERVER=1
lib_deps =
    ${esp32s3_base.lib_deps}
    hideakitai/ArduinoEigen @ ^0.3.2
extra_scripts = pre:tools/camera_web_env.py

; Camera web-server smoke target. It bypasses Grove hardware and injects
; synthetic JPEG frames into the existing /stream/frame pipeline.
[env:xiao_esp32s3_camera_web_fake]
extends = env:xiao_esp32s3_camera_web
build_flags =
    ${env:xiao_esp32s3_camera_web.build_flags}
    -D WILDLIFE_FAKE_JPEG=1

; -----------------------------------------------------------------------------
; Host unit tests + coverage (Core only, no Arduino headers)
; -----------------------------------------------------------------------------
[env:native]
platform       = native
test_framework = unity
build_type     = debug
test_filter    = native/*
test_ignore    = native/test_util
build_flags =
    ${env.build_flags}
    -D WILDLIFE_HOST_BUILD=1
    -I lib/wildlife_core/include
    -fprofile-arcs
    -ftest-coverage
    -O0
    -g3
extra_scripts = pre:tools/pio_native_pre.py
